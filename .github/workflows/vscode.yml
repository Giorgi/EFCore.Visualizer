name: VS Code extension

on:
  push:
    paths: [ 'src/EFCore.Visualizer.VSCode/**', 'src/EFCore.Visualizer.Core/**', 'samples/SampleApp/**', '.github/workflows/vscode.yml' ]
  pull_request:
    paths: [ 'src/EFCore.Visualizer.VSCode/**', 'src/EFCore.Visualizer.Core/**', 'samples/SampleApp/**', '.github/workflows/vscode.yml' ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest VS Code, and the oldest one package.json allows (engines.vscode). Each gets the newest
        # C# extension compatible with it, so older debuggers are tested too.
        vscode: [ stable, 1.90.0 ]
    name: integration-test (VS Code ${{ matrix.vscode }})
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    defaults:
      run:
        working-directory: src/EFCore.Visualizer.VSCode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run pretest
      - run: xvfb-run -a npm run test --ignore-scripts
      # A VSIX of every run, for trying a build by hand (for example on macOS). Only the stable job packages it:
      # the package doesn't depend on the VS Code version tested. Publishing is vscode-publish.yml.
      - name: Package
        if: matrix.vscode == 'stable'
        id: vsix
        run: |
          npm run package
          name="$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").vsix"
          test -f "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload VSIX
        if: matrix.vscode == 'stable'
        uses: actions/upload-artifact@v7
        with:
          # Upload the .vsix as-is instead of zipped. The artifact is named after the file.
          archive: false
          path: src/EFCore.Visualizer.VSCode/${{ steps.vsix.outputs.name }}
          if-no-files-found: error
