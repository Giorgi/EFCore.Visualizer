<script src="vue.global.prod.js"></script>
<script src="pev2.umd.js"></script>
<link href="bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<meta charset="utf-8">

<script>
  // Bootstrap 5.3 (and pev2's styles) switch to dark mode through data-bs-theme,
  // not prefers-color-scheme. The extension sets the preferred scheme from the VS theme.
  document.documentElement.setAttribute("data-bs-theme",
    window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
</script>

<div id="app" class="d-flex flex-column vh-100">
  <pev2 :plan-source="plan" :plan-query="query" />
</div>

<script>
  const { createApp } = Vue

  const plan = "{plan}"
  const query = "{query}"

  const app = createApp({
    data() {
      return {
        plan: plan,
        query: query,
      }
    },
  })
  app.component("pev2", pev2.Plan)
  app.mount("#app")
</script>
