# Rider SDK to build and test against: the oldest supported version (matches sinceBuild = 262). Use
# -PriderVersion=2026.3.0.1 to run the tests on the newest one.
riderVersion=2026.2.4
# Rider that runRider starts with the plugin, unless localRider names a Rider install.
runRiderVersion=2026.3.0.1
# Rider versions the Plugin Verifier checks (verifyPlugin): both ends of the supported range.
verifyRiderVersions=2026.2.4,2026.3.0.1
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx3g
