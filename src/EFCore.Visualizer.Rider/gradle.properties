# Rider SDK to build and test against. The default is the oldest supported version (matches sinceBuild = 251);
# use -PriderVersion=2026.2.4 to build and run the tests on the newest one.
riderVersion=2025.1.9
# Rider versions the Plugin Verifier checks (verifyPlugin): both ends of the supported range.
verifyRiderVersions=2025.1.9,2026.2.4
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx3g
