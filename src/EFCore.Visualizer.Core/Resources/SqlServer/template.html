<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link type="text/css" media="all" rel="stylesheet" href="qp.css" />
    <link rel="stylesheet" media="(prefers-color-scheme: light)" href="../Common/highlight.css">
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="../Common/highlight.dark.min.css">
    <!-- Add highlight.js core and SQL language -->
    <script type="text/javascript" src="qp.min.js"></script>
    <script type="text/javascript" src="../Common/highlight.min.js"></script>
    <script type="text/javascript" src="../Common/highlight.sql.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: black;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: black;
                --text-color: white;
            }
        }

        .hljs-keyword {
            text-transform: uppercase;
        }

        /* Only in light mode: in dark mode highlight.dark.min.css colors the keywords. */
        @media (prefers-color-scheme: light) {
            .hljs-keyword {
                color: #800;
            }
        }

        .hljs-built_in {
            text-transform: uppercase;
        }

        .qp-statement-header {
            color: var(--text-color);
        }

        /* The plan's operators and tooltips have light backgrounds in every theme (qp.css), so their text stays
           dark. Without this they'd inherit the page's text color, which VS Code sets to the theme's foreground. */
        div.qp-node, .qp-tt {
            color: black;
        }

        /* The arrows are an SVG as wide as the window, not as the plan. In a window narrower than the plan, the
           arrows past its right edge were cut off; let them show outside the SVG's box instead. */
        div.qp-root > svg {
            overflow: visible;
        }

        body {
            background: var(--bg-color);
        }
    </style>
</head>
<body>
    <div id="container">

    </div>
    <script>
        drawPlan();

        window.addEventListener("resize", function (e) {
            clearTimeout(window.resizedFinished);
            window.resizedFinished = setTimeout(function () {
                drawPlan();
            }, 200);
        });

        function drawPlan() {
            QP.showPlan(document.getElementById("container"), '{plan}');

            hljs.highlightElement(document.getElementsByClassName('qp-statement-header-row')[0].firstChild);
        }
    </script>
</body>
</html>
