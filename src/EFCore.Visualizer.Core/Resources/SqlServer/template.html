<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link type="text/css" media="all" rel="stylesheet" href="qp.css" />
    <link rel="stylesheet" media="(prefers-color-scheme: light)" href="../Common/highlight.css">
    <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="../Common/highlight.dark.min.css">
    <!-- Add highlight.js core and SQL language -->
    <script type="text/javascript" src="qp.min.js"></script>
    <script type="text/javascript" src="../Common/highlight.min.js"></script>
    <script type="text/javascript" src="../Common/highlight.sql.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: black;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: black;
                --text-color: white;
            }
        }

        .hljs-keyword {
            text-transform: uppercase;
        }

        /* Only in light mode: in dark mode highlight.dark.min.css colors the keywords. */
        @media (prefers-color-scheme: light) {
            .hljs-keyword {
                color: #800;
            }
        }

        .hljs-built_in {
            text-transform: uppercase;
        }

        /* 13px, as before the switch to the fork, whose qp.css sets 11px on the whole plan: the SQL is read, not
           glanced at. */
        .qp-statement-header {
            color: var(--text-color);
            font-size: 13px;
        }

        /* The whole SQL, wrapped, instead of qp.css's single line cut off with an ellipsis. */
        .qp-statement-header-row {
            height: auto;
        }

        .qp-statement-header-row > div {
            position: static;
            width: auto;
            white-space: normal;
        }

        /* The arrows are an SVG as wide as the window, not as the plan. In a window narrower than the plan, the
           arrows past its right edge were cut off; let them show outside the SVG's box instead. */
        div.qp-root > svg {
            overflow: visible;
        }

        body {
            background: var(--bg-color);
        }
    </style>
</head>
<body>
    <div id="container">

    </div>
    <script>
        drawPlan();

        window.addEventListener("resize", function (e) {
            clearTimeout(window.resizedFinished);
            window.resizedFinished = setTimeout(function () {
                drawPlan();
            }, 200);
        });

        function drawPlan() {
            // The theme is passed rather than "auto": with "auto", qp.css picks the theme with a media query, but VS Code
            // and Rider set the page's theme by rewriting the media queries of this page, which doesn't reach qp.css.
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            QP.showPlan(document.getElementById("container"), '{plan}', { theme: dark ? "dark" : "light" });

            hljs.highlightElement(document.getElementsByClassName('qp-statement-header-row')[0].firstChild);
        }
    </script>
</body>
</html>
